# LTX-2.3 Image+Audio to Video Configuration
#
# Model paths: Update these to point to your local model files.
# Download from https://huggingface.co/Lightricks/LTX-2.3

models:
  checkpoint: ./models/ltx-2.3-22b-dev.safetensors
  distilled_lora: ./models/ltx-2.3-22b-distilled-lora-384.safetensors
  distilled_lora_strength: 0.8
  spatial_upscaler: ./models/ltx-2.3-spatial-upscaler-x2-1.1.safetensors
  gemma_root: ~/.cache/huggingface/ltx2_gemma3

generation:
  height: null                # null = auto from image (snapped to 32-multiples)
  width: null                 # null = auto from image (snapped to 32-multiples)
  num_frames: null            # null = auto from audio duration (8k+1 format)
  frame_rate: 25.0
  num_inference_steps: 20     # Stage 1 steps (stage 2 always uses 4 distilled steps)
  seed: 42
  negative_prompt: "blurry, low quality, distorted, deformed face, bad lip sync, static, frozen, dull expression, cartoonish, 3D CGI, uncanny valley, jittery movement, flickering, artifacts"
  # Image conditioning strength: 1.0 freezes frame 0, 0.0 = free generation.
  # 0.7-0.8 preserves identity while allowing lip sync (per working ComfyUI workflows).
  image_conditioning_strength: 0.7

guidance:
  video_cfg_scale: 3.0        # Classifier-free guidance scale
  video_stg_scale: 0.0        # STG OFF — working ComfyUI workflows disable this
  video_rescale_scale: 0.0    # CFG rescale OFF — matches working workflows
  video_stg_blocks: [29]      # Block 29 (working workflows use 29, not 28)
  video_skip_step: 0
  a2v_guidance_scale: 3.0     # Video modality guidance (audio-to-video coupling)
  audio_cfg_scale: 7.0        # Audio classifier-free guidance — CRITICAL for lip sync
  audio_modality_scale: 3.0   # Audio modality guidance — CRITICAL for lip sync

audio:
  start_time: 0.0             # Audio offset in seconds
  max_duration: null           # null = match video length

performance:
  enhance_prompt: false
  streaming_prefetch_count: null
  max_batch_size: 1
  # max_pixels caps input resolution to prevent OOM. 614400 = ~640x960.
  # Setting to 0 removes the cap — WILL OOM on 128GB with large images.
  # Use 409600 (~640x640) for extra safety margin.
  max_pixels: 614400
