# LTX-2.3 Image+Audio to Video — Quality Mode
#
# Uses the proven working fast config values (10 steps, 409600 max_pixels).
# On Apple Silicon MPS, higher steps or resolution break lip sync.
# Use post-process upscaling for higher resolution output.

models:
  checkpoint: ./models/ltx-2.3-22b-dev.safetensors
  distilled_lora: ./models/ltx-2.3-22b-distilled-lora-384.safetensors
  distilled_lora_strength: 0.8
  spatial_upscaler: ./models/ltx-2.3-spatial-upscaler-x2-1.1.safetensors
  gemma_root: ~/.cache/huggingface/ltx2_gemma3

generation:
  height: null
  width: null
  num_frames: null
  frame_rate: 25.0
  num_inference_steps: 10
  seed: 42
  negative_prompt: "blurry, low quality, distorted, deformed face, bad lip sync, static, frozen, dull expression"
  image_conditioning_strength: 0.7

guidance:
  video_cfg_scale: 3.5
  video_stg_scale: 1.0        # STG ON — testing Approach A float32 fix
  video_rescale_scale: 0.7
  video_stg_blocks: [28]      # Block 28 for LTX-2.3
  video_skip_step: 0
  a2v_guidance_scale: 3.0

audio:
  start_time: 0.0
  max_duration: null

performance:
  enhance_prompt: false
  streaming_prefetch_count: null
  max_batch_size: 1
  max_pixels: 409600
